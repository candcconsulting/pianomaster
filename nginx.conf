server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No-cache header so updates are seen immediately on reload for HTML.
    # If a songs/ directory is published, expose a JSON autoindex so the
    # client-side loader can discover additional song JSON files.
    location /songs/ {
        autoindex on;
        autoindex_format json;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Cache policy: don't cache HTML; static assets may be cached but served
    # in a way that still updates quickly during development.
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    error_page 404 /index.html;
}
