<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Just Play — a free piano learning app. No subscription. Pick up where you left off.">
  <title>Just Play 🎹</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="home-wrap">

  <!-- Header -->
  <header class="home-header">
    <div class="logo">🎹 <span class="logo-word">Just Play</span></div>
    <p class="tagline">Pick up where you left off. No subscription, ever.</p>
  </header>

  <!-- Resume banner (injected by JS if there's a last-played song) -->
  <div id="resume-container"></div>

  <!-- Song cards grid -->
  <div class="songs-grid" id="songs-grid">
    <!-- Injected by app.js -->
  </div>

</div>

<script src="js/songs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
